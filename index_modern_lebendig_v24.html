n vollständig durchgaren."]};

const selectedRecipes2026={"bulgogi":["Bulgogi – Koreanisches Rindfleisch","25–35 Min. · 2 Portionen",["300 g Rindfleisch","1 Zwiebel","2 EL Sojasauce","1 EL Sesamöl","1 TL Honig","2 Knoblauchzehen","120 g Reis"],["Rindfleisch sehr dünn schneiden. Sojasauce, Sesamöl, Honig und gehackten Knoblauch verrühren.","Fleisch und Zwiebelstreifen 15–30 Minuten marinieren; währenddessen Reis kochen.","Pfanne stark erhitzen und Fleisch samt Zwiebeln portionsweise kurz kräftig braten. Mit Reis servieren."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"lasagne_spinat":["Spinat-Ricotta-Lasagne","45–60 Min. · 2 Portionen",["6 Lasagneplatten","250 g Spinat","200 g Ricotta","300 g passierte Tomaten","100 g Mozzarella"],["Spinat auftauen bzw. zusammenfallen lassen und gut ausdrücken. Mit Ricotta verrühren, würzen.","In einer Auflaufform abwechselnd Tomatensauce, Lasagneplatten und Spinat-Ricotta schichten. Mit Sauce abschließen und Mozzarella darübergeben.","Bei 190 °C Ober-/Unterhitze etwa 35–40 Minuten backen, bis die Platten weich sind. Vor dem Anschneiden kurz ruhen lassen."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"kimchi_jjigae_new":["Kimchi-Jjigae – Kimchi-Eintopf","25–35 Min. · 2 Portionen",["200 g Kimchi","200 g fester Tofu","100 g Schweinefleisch","1 Zwiebel","1 Frühlingszwiebel","400 ml Brühe"],["Kimchi, Zwiebel und Schweinefleisch klein schneiden. Tofu in Würfel schneiden.","Schweinefleisch und Kimchi 3–5 Minuten anbraten, Zwiebel dazugeben. Brühe angießen und 15 Minuten köcheln lassen.","Tofu einlegen, weitere 5 Minuten sanft köcheln und mit Frühlingszwiebel servieren."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"norma":["Pasta alla Norma","25–35 Min. · 2 Portionen",["180 g Pasta","1 Aubergine","300 g gehackte Tomaten","1 Knoblauchzehe","40 g Parmesan","Basilikum"],["Aubergine würfeln, salzen und in Olive ose Thunfisch","250 g Tomaten","2 TL Kapern","1 Knoblauchzehe"],["Pasta in Salzwasser al dente kochen und etwas Kochwasser aufheben.","Knoblauch in Olivenöl kurz anschwitzen. Tomaten und Kapern zugeben und 8–10 Minuten köcheln.","Abgetropften Thunfisch vorsichtig unterheben, Pasta mit etwas Kochwasser einrühren und abschmecken."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"beef_broccoli":["Rindfleisch mit Brokkoli","25–35 Min. · 2 Portionen",["300 g Rindfleisch","300 g Brokkoli","2 EL Sojasauce","1 Knoblauchzehe","120 g Reis"],["Reis kochen. Brokkoli in kleine Röschen schneiden und 2–3 Minuten blanchieren.","Rindfleisch dünn schneiden und in heißer Pfanne portionsweise scharf anbraten, herausnehmen.","Knoblauch kurz anbraten, Brokkoli, Fleisch und Sojasauce zugeben. Kurz schwenken und mit Reis servieren."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"chili":["Chili con Carne","25–35 Min. · 2 Portionen",["250 g Rinderhackfleisch","1 Dose Kidneybohnen","1 Dose Tomaten","1 Paprika","1 Zwiebel","1 TL Kreuzkümmel"],["Zwiebel und Paprika würfeln. Hackfleisch in einem Topf krümelig und kräftig anbraten.","Zwiebel, Paprika und Kreuzkümmel zugeben, kurz mitbraten. Tomaten und abgetropfte Kidneybohnen einrühren.","20–25 Minuten leicht köcheln lassen, bei Bedarf Wasser zugeben und mit Salz und Pfeffer abschmecken."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"oyakodon":["Oyakodon – Hähnchen-Ei-Reisschale","25–35 Min. · 2 Portionen",["250 g Hähnchen","2 Eier","1 Zwiebel","2 EL Sojasauce","1 TL Zucker","120 g Reis"],["Reis kochen. Hähnchen in kleine Stücke, Zwiebel in feine Streifen schneiden. Eier nur grob verquirlen.","Zwiebel und Hähnchen mit Sojasauce, Zucker und etwas Wasser in einer kleinen Pfanne sanft garen, bis das Fleisch durch ist.","Eier darübergeben, abdecken und nur so lange stocken lassen wie gewünscht. Auf Reis anrichten."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"cod_beans":["Kabeljau mit weißen Bohnen und Tomaten","25–35 Min. · 2 Portionen",["300 g Kabeljau","1 Dose weiße Bohnen","200 g Cherrytomaten","1 Knoblauchzehe","1 EL Olivenöl"],["Kabeljau trocken tupfen und leicht salzen. Bohnen abspülen, Tomaten halbieren.","Knoblauch in Olivenöl anschwitzen, Tomaten und Bohnen zugeben und 5–7 Minuten köcheln. Bei Bedarf etwas Wasser ergänzen.","Fisch auf das Gemüse legen, abdecken und etwa 8–12 Minuten sanft gar ziehen lassen, bis er durchgegart ist."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"stuffed_peppers":["Gefüllte Paprika mit Putenhack und Feta","45–60 Min. · 2 Portionen",["2 Paprika","250 g Putenhackfleisch","80 g Feta","100 g Reis","200 g passierte Tomaten"],["Reis vorgaren. Paprika längs halbieren und Kerne entfernen. Ofen auf 190 °C vorheizen.","Putenhack mit Reis, zerbröseltem Feta und Gewürzen mischen. Paprikahälften füllen und auf Tomatensauce in eine Auflaufform setzen.","Abgedeckt etwa 30 Minuten backen, dann offen weitere 10–15 Minuten, bis die Füllung vollständig durchgegart ist."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"miso_salmon":["Miso-Lachs mit Pak Choi und Reis","25–35 Min. · 2 Portionen",["300 g Lachs","2 Pak Choi","1 EL Misopaste","1 TL Honig","120 g Reis"],["Reis kochen. Misopaste mit Honig und etwas Wasser verrühren. Pak Choi längs halbieren.","Lachs mit der Misomischung bestreichen und bei 200 °C etwa 12–15 Minuten backen, bis er gar ist.","Pak Choi in wenig Öl kurz anbraten, mit etwas Wasser fertig dünsten. Mit Lachs und Reis servieren."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"mackerel":["Godeungeo-Gui – Koreanische Makrele","25–35 Min. · 2 Portionen",["2 Makrelenfilets","1 TL Öl","1 Zitrone","120 g Reis","1 Gurke"],["Makrelenfilets trocken tupfen, leicht salzen und die Hautseite dünn einölen. Reis kochen.","Pfanne auf mittelhohe Hitze bringen. Filets zuerst auf der Hautseite knusprig braten, wenden und vollständig garen.","Mit Reis, Gurke und etwas Zitrone servieren. Auf Gräten achten."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"chickpea_curry":["Kichererbsen-Spinat-Curry mit Kokosmilch","25–35 Min. · 2 Portionen",["1 Dose Kichererbsen","150 g TK-Spinat","200 ml Kokosmilch","200 g gehackte Tomaten","½ Zwiebel","1 Knoblauchzehe","120 g Reis"],["Reis kochen. Zwiebel und Knoblauch fein schneiden, in etwas Öl anschwitzen. Currypulver und Kreuzkümmel kurz mitrösten.","Tomaten, Kokosmilch und abgespülte Kichererbsen zugeben und 10 Minuten köcheln.","TK-Spinat einrühren und vollständig erhitzen. Abschmecken und mit Reis servieren."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"chickpea_feta":["Knusprige Kichererbsen-Pfanne mit Feta und Tomaten","25–35 Min. · 2 Portionen",["1 Dose Kichererbsen","200 g Cherrytomaten","100 g Feta","1 Knoblauchzehe","1 TL Paprikapulver","½ Zitrone"],["Kichererbsen abspülen und sehr gut trocken tupfen. Tomaten halbieren, Knoblauch hacken.","Kichererbsen in Olivenöl 7–8 Minuten goldbraun braten. Knoblauch und Paprikapulver kurz mitbraten, Tomaten zugeben.","Noch 3–5 Minuten braten, Feta darüberbröseln und mit Zitronensaft abschmecken."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"oi_muchim":["Oi-muchim – Koreanischer Gurkensalat","10–15 Min. · 2 Beilagenportionen",["1 Gurke","1 TL Gochugaru","1 EL Reisessig","1 TL Sojasauce","1 TL Sesamöl"],["Gurke in dünne Scheiben schneiden, leicht salzen und 10 Minuten ziehen lassen. Flüssigkeit abgießen.","Gochugaru, Reisessig, Sojasauce und Sesamöl verrühren.","Gurke mit dem Dressing mischen und möglichst frisch servieren."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"sigeumchi":["Sigeumchi-namul – Sesamspinat","10–15 Min. · 2 Beilagenportionen",["250 g Spinat","1 TL Sesamöl","1 TL Sojasauce","1 TL Sesam"],["Spinat kurz in kochendem Wasser blanchieren, kalt abschrecken und sehr gut ausdrücken.","Spinat grob schneiden und mit Sojasauce und Sesamöl vermengen.","Mit Sesam bestreuen und kalt oder bei Zimmertemperatur servieren."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"gamjachae":["Gamjachae-bokkeum – Kartoffelstreifen","10–15 Min. · 2 Beilagenportionen",["300 g Kartoffeln","½ Karotte","1 EL Öl","1 Prise Salz"],["Kartoffeln und Karotte in sehr feine Stifte schneiden. Kartoffelstifte kurz in kaltem Wasser spülen und abtrocknen.","Öl in einer Pfanne erhitzen, Kartoffeln und Karotte bei mittlerer bis hoher Hitze unter Wenden 5–8 Minuten braten.","Salzen und servieren, solange die Stifte noch leicht Biss haben."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"kongnamul_side":["Kongnamul-muchim – Sojasprossen","10–15 Min. · 2 Beilagenportionen",["250 g Sojasprossen","1 TL Sesamöl","1 TL Sojasauce","1 Frühlingszwiebel"],["Sojasprossen gründlich waschen und in kochendem Wasser mit Deckel etwa 5 Minuten garen.","Abgießen, kurz abkühlen lassen und gut abtropfen.","Mit Sesamöl, Sojasauce und fein geschnittener Frühlingszwiebel vermengen."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"musaengchae":["Musaengchae – Scharfer Rettichsalat","10–15 Min. · 2 Beilagenportionen",["300 g Daikon","1 TL Gochugaru","1 EL Reisessig","1 TL Zucker"],["Daikon schälen und in feine Stifte schneiden.","Mit Gochugaru, Reisessig und Zucker vermengen und leicht durchkneten.","10 Minuten ziehen lassen und vor dem Servieren abschmecken."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe alat","10–15 Min. · 2 Beilagenportionen",["250 g gekochte Rote Bete","100 g Feta","20 g Walnüsse","50 g Rucola","1 EL Balsamico"],["Gekochte Rote Bete würfeln. Rucola waschen und trocken schleudern.","Walnüsse grob hacken und kurz trocken rösten. Balsamico mit etwas Olivenöl verrühren.","Rote Bete und Rucola anrichten, Feta und Walnüsse darübergeben und Dressing zufügen."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"chickpea_salad":["Italienischer Kichererbsensalat","10–15 Min. · 2 Beilagenportionen",["1 Dose Kichererbsen","¼ rote Zwiebel","½ Zitrone","Petersilie","1 EL Olivenöl"],["Kichererbsen abspülen und abtropfen lassen. Rote Zwiebel fein schneiden, Petersilie hacken.","Mit Zitronensaft und Olivenöl mischen.","Salzen, pfeffern und kurz durchziehen lassen."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."],"feldsalat":["Feldsalat mit Apfel und Walnüssen","10–15 Min. · 2 Beilagenportionen",["100 g Feldsalat","½ Apfel","20 g Walnüsse","1 TL Dijon-Senf","1 TL Honig","1 EL Weißweinessig","2 EL Olivenöl"],["Feldsalat gründlich waschen und trocken schleudern. Apfel in dünne Scheiben schneiden, Walnüsse grob hacken und rösten.","Dijon-Senf, Honig, Weißweinessig und Olivenöl zu einem Dressing verrühren.","Feldsalat und Apfel erst kurz vor dem Servieren mit dem Dressing mischen und Walnüsse darüberstreuen."],"Für 2 Portionen; Mengen nach Geschmack anpassen. Garzeiten abhängig von Größe und Gerät prüfen."]};

function ingredientParts(raw){
 let t=String(raw||'').trim().replace(/^ca\.\s*/i,'');
 const fractions={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};

function pQty(x){return x.unit==='kg'?x.qty*1000:x.unit==='l'?x.qty*1000:x.qty}

 function placeLeft(id,idx){
  const x=findLeft(id);if(!x||remaining(x)<1){alert('Diese Restportion ist nicht mehr vorhanden.');return}

  const other=state.days.reduce((n,d,i)=>n+(i!==idx&&d.plannedLeftoverId!=null&&String(d.plannedLeftoverId)===String(id)&&!d.leftoverConsumed?1:0),0);
  if(other>=remaining(x)){alert('Alle verfügbaren Portionen sind bereits für andere Tage eingeplant.');return}
  const old=state.days[idx]||{};
  state.days[idx]={key:'',title:x.name,note:'Vorhandene Reste · '+x.place,portions:1,sideKeys:[],cookingMode:'stored-leftover',plannedLeftoverId:x.id,leftoverConsumed:false};
  state.cooked=state.cooked.filter(n=>n!==idx);editDay=null;save();render();
 }

 const oldPlan=renderPlan;
 renderPlan=function(){
  oldPlan();if(tab!=='plan'||editDay!==null)return;
  out.querySelectorAll('.day').forEach(card=>{
   const edit=card.querySelector('[data-editday]');if(!edit)return;
   const idx=Number(edit.dataset.editday),d=state.days[idx];if(!dayHasLeft(d))return;
   const x=findLeft(d.plannedLeftoverId),meal=card.querySelector('.meal');if(!meal)return;
   const note=meal.querySelector('small');if(note)note.textContent=d.leftoverConsumed?'Portion gegessen':('Vorhandene Reste'+(x?' · '+x.place:''));
   card.querySelector('.meal-chip')?.remove();card.querySelector('.cook-finish-btn')?.remove();
   const chip=document.createElement('span');chip.className='leftover-plan-chip';chip.textContent=d.leftoverConsumed?'Gegessen':'Aus Vorrat';meal.append(chip);
   const check=card.querySelector('[data-cook]');if(check){check.style.display='none';}
   if(!d.leftoverConsumed){
    const actions=document.createElement('div');actions.className='leftover-plan-actions';const btn=document.createElement('button');btn.type='button';btn.className='outline';btn.textContent='Portion gegessen';btn.onclick=()=>{
     if(!confirm('Eine Portion „'+d.title+'“ als gegessen markieren?'))return;
     const stored=findLeft(d.plannedLeftoverId);if(!stored){alert('Der gespeicherte Rest ist nicht mehr im Vorrat. Bitte prüfe deinen Bestand.');return}
     if(remaining(stored)<1){alert('Keine Portion mehr im Vorrat vorhanden.');return}
     stored.portions=remaining(stored)-1;
     if(stored.portions===0)state.leftovers=state.leftovers.filter(z=>String(z.id)!==String(stored.id));
     d.leftoverConsumed=true;state.cooked=[...new Set([...state.cooked,idx])];save();render();
    };actions.append(btn);meal.append(actions);
   }
  });
 };
 const oldPantry=renderPantry;
 renderPantry=function(){
  oldPantry();if(tab!=='pantry')return;
  out.querySelectorAll('[data-left]').forEach(btn=>{
   const id=btn.dataset.left,entry=findLeft(id);if(!entry)return;
   const choose=document.createElement('button');choose.type='button';choose.className='outline';choose.style.marginLeft='8px';choose.textContent='Im Wochenplan einplanen';
   choose.onclick=()=>{
    const start=week*7;ensureWeek(week);
    const days=state.days.slice(start,start+7).map((d,i)=>({i:start+i,d}));
    const options=days.map(({i,d})=>dayName(dateAt(i))+', '+fmt(dateAt(i))+' – '+d.title);
    const choice=prompt('Welchen Tag möchtest du ersetzen?\n'+options.map((x,i)=>(i+1)+'. '+x).join('\n')+'\nBitte Zahl 1–7 eingeben:','1');
    if(choice===null)return;const num=Number(choice);if(!Number.isInteger(num)||num<1||num>7){alert('Bitte eine Zahl von 1 bis 7 eingeben.');return}
    placeLeft(id,start+num-1);tab='plan';render();
   };btn.after(choose);
  });
 };
})();
</script>
</body></html>
