const recipes={cod:['Mediterraner Kabeljau mit Oliven, Kapern und Tomaten','25 Min. · 2 Portionen',['300–400 g Kabeljau (2 Filets)','1 EL Olivenöl','Saft von ½ Zitrone','2 Knoblauchzehen','½ TL Paprikapulver','½ TL getrockneter Oregano','¼ TL Salz und etwas Pfeffer','80 g Cherrytomaten','40 g Kalamata-Oliven','¼ kleine rote Zwiebel','3 TL Kapern','2 EL Petersilie oder Basilikum','Reis, Couscous oder Brot'],['Backofen auf 200 °C Ober-/Unterhitze vorheizen. Kabeljau trocken tupfen.','Fisch in eine Auflaufform legen und mit Olivenöl und Zitronensaft beträufeln.','Knoblauch, Paprika, Oregano, Salz und Pfeffer darauf verteilen.','Tomaten, Oliven, Zwiebel und Kapern rundherum verteilen.','Ca. 12–15 Minuten backen, bei dickeren Filets länger, bis der Fisch vollständig durchgegart ist.','Mit Kräutern und Reis, Couscous oder Brot servieren. Zweite Portion rasch kühlen und am nächsten Tag vollständig durcherhitzen.'],'Kapern und Oliven sind salzig: sparsam salzen.'],orzo:['Cremiger Zitronen-Orzo','25 Min. · 2 Portionen',['160 g Orzo','120–150 g Spinat','40 g Parmesan (bereits geöffnet)','1 Zitrone','1 Knoblauchzehe','400–450 ml Gemüsebrühe'],['Knoblauch in 1 EL Olivenöl anschwitzen.','Orzo und 400 ml Brühe zugeben, 10–12 Minuten köcheln und regelmäßig rühren.','Spinat unterheben, Herd ausschalten und Parmesan einrühren.','Mit 1 EL Zitronensaft und ¼ TL Pfeffer abschmecken.'],'Zweite Portion für Donnerstag kühlen.'],soup:['Sogogi-Muguk (소고기뭇국)','60 Min. · 3 Portionen',['350 g Rindfleisch','450 g Daikon','2 Frühlingszwiebeln','2 Knoblauchzehen','900 ml Wasser'],['Fleisch in 1 EL Sesamöl 3 Minuten anbraten.','Rettich 3 Minuten mitbraten.','Knoblauch, 1 EL Sojasauce und Wasser zugeben und 45–50 Minuten köcheln.','Frühlingszwiebeln zugeben und abschmecken.'],'Für Montag und Dienstag aufwärmen.'],jjigae:['Doenjang-Jjigae (된장찌개)','30 Min. · 2 Portionen',['200 g Tofu','½ Zucchini','150 g Champignons','Frühlingszwiebeln','500 ml Wasser','1–1½ EL Doenjang'],['Gemüse und Tofu würfeln.', const extraRecipes={"miyeok":["Miyeok-guk (미역국) – Koreanische Algensuppe mit Rindfleisch","45 Min. · 3 Portionen",["20 g getrocknete Miyeok-Algen (Wakame für Suppe)","180 g Rindfleisch (z. B. Suppenfleisch, dünn geschnitten)","1 EL Sesamöl","2 Knoblauchzehen, fein gehackt","1½ EL Guk-Ganjang (koreanische Suppensojasauce)","1,2 l Wasser","Salz nach Geschmack"],["Getrocknete Algen 10–15 Minuten in kaltem Wasser einweichen, gut abspülen, ausdrücken und in mundgerechte Stücke schneiden.","Rindfleisch im Sesamöl 3–4 Minuten anbraten. Algen zugeben und weitere 2 Minuten mitbraten.","Knoblauch, Suppensojasauce und Wasser zugeben. Aufkochen, dann 25–30 Minuten sanft köcheln.","Mit etwas Salz oder weiterer Suppensojasauce abschmecken. Mit Reis servieren."],"Für zwei Tage gut geeignet; zügig abkühlen und im Kühlschrank aufbewahren."],"kimchijjigae":["Kimchi-Jjigae (김치찌개) – Kimchi-Eintopf","30 Min. · 2 Portionen",["200 g gut fermentiertes Kimchi","150 g fester Tofu","100 g Schweinefleisch oder zusätzlich Tofu","½ Zwiebel","1 Frühlingszwiebel","400 ml Wasser oder milde Brühe","1 TL Gochugaru (optional)","1 TL Sesamöl","Reis zum Servieren"],["Kimchi und Zwiebel grob schneiden; Fleisch gegebenenfalls würfeln.","Sesamöl erhitzen, Fleisch vollständig anbraten und Kimchi 3–4 Minuten mitbraten.","Wasser oder Brühe zugeben, nach Wunsch Gochugaru einrühren und 15 Minuten köcheln.","Tofu in Scheiben zugeben, 5 Minuten ziehen lassen und mit Frühlingszwiebel und Reis servieren."],"Ohne Fleisch ebenfalls lecker; gut für zwei Mahlzeiten."],"japchae":["Japchae (잡채) – Koreanische Glasnudeln","35 Min. · 2 Portionen",["150 g koreanische Süßkartoffel-Glasnudeln (Dangmyeon)","1 Karotte","½ Paprika","100 g Spinat","100 g Champignons","½ Zwiebel","2 EL Sojasauce","1 EL Sesamöl","1 TL Zucker","1 TL Sesamsamen"],["Glasnudeln nach Packungsangabe kochen, abgießen und mit etwas Sesamöl vermischen.","Gemüse in feine Streifen schneiden. Zwiebel, Karotte, Paprika und Pilze nacheinander anbraten.","Spinat kurz blanchieren oder in der Pfanne zusammenfallen lassen.","Sojasauce, Zucker und Sesamöl mischen. Alles mit den Nudeln vermengen und kurz erwärmen. Mit Sesam bestreuen."],"Schmeckt auch lauwarm; Reste gekühlt aufbewahren."],"dakgalbi":["Dakgalbi (닭갈비) – Scharfes Hähnchen mit Gemüse","30 Min. · 2 Portionen",["300 g Hähnchenbrust oder -keule ohne Knochen","150 g Weißkohl","½ Süßkartoffel","½ Zwiebel","1 Frühlingszwiebel","1 EL Gochujang","1 TL Gochugaru (optional)","1 EL Sojasauce","1 TL Zucker","1 TL Sesamöl","2 EL Wasser","Reis zum Servieren"],["Hähnchen in kleine Stücke schneiden, Gemüse in mundgerechte Stücke schneiden.","Gochujang, Gochugaru, Sojasauce, Zucker, Sesamöl und Wasser verrühren.","Hähnchen mit der Sauce vermischen und in einer großen Pfanne anbraten.","Gemüse zugeben und zugedeckt 12–15 Minuten garen, bis Hähnchen und Süßkartoffel vollständig durchgegart sind. Mit Reis servieren."],"Für weniger Schärfe Gochujang halbieren."],"gyeranjjim":["Gyeran-jjim (계란찜) – Koreanisches gedämpftes Ei","15 Min. · 1–2 Portionen",["3 Eier","150 ml Wasser oder milde Brühe","1 Frühlingszwiebel","¼ TL Salz","½ TL Sesamöl"],["Eier mit Wasser oder Brühe und Salz gründlich verquirlen.","In einen kleinen Topf mit dickem Boden geben und bei niedriger bis mittlerer Hitze unter Rühren leicht stocken lassen.","Hitze reduzieren, abdecken und weitere 4–6 Minuten sanft garen, bis die Eier vollständig gestockt sind.","Mit Frühlingszwiebel und Sesamöl servieren."],"Gut als schnelles Abendessen mit Reis und Kimchi."],"kongnamul":["Kongnamul-guk (콩나물국) – Sojasprossensuppe","20 Min. · 2 Portionen",["200 g Sojabohnensprossen","700 ml Wasser oder Brühe","1 Knoblauchzehe","1 Frühlingszwiebel","1 EL Guk-Ganjang (Suppensojasauce)","Salz nach Geschmack"],["Sojabohnensprossen gründlich waschen.","Wasser aufkochen, Sprossen und Knoblauch zugeben und 10–12 Minuten kochen.","Suppensojasauce und Salz zugeben und abschmecken.","Mit Frühlingszwiebel und Reis servieren."],"Leicht und günstig; Sprossen vollständig durchgaren."]};

// Dynamic ingredient quantities, per-recipe groups, and persistent checkmarks.
function ingredientParts(raw){
 let t=String(raw||'').trim().replace(/^ca\.\s*/i,'');
 const fractions={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};
 const m=t.match(/^(\d+(?:[.,]\d+)?|[½¼¾⅓⅔]|\d+\s*[½¼¾])\s*(?:(kg|g|ml|l|EL|TL|Stück|Dose|Dosen|Bund|Packung|Packungen|Zehen|Eier)\s+)?(.+)$/i);
 if(!m)return {name:t,qty:0,unit:'',unmeasured:true};
 let n=m[1].replace(',','.');for(const [f,v] of Object.entries(fractions))n=n.replace(f,'+'+v);
 let qty=n.split('+').reduce((a,b)=>a+Number(b),0),unit=(m[2]||'Stück').toLowerCase(),name=m[3].trim();
 if(unit==='kg'){qty*=1000;unit='g'}if(unit==='l'){qty*=1000;unit='ml'}
 if(unit==='dosen')unit='dose';if(unit==='packungen')unit='packung';if(unit==='zehen')unit='zehe';
 if(unit==='eier'){name='Eier '+name;unit='stück'}
 return {name,qty,unit,unmeasured:false};
}
function amount(n){return Number.isInteger(n)?String(n):String(Math.round(n*100)/100).replace('.',',')}
function makeRows(k,portions,w,day,side=false){const r=state.recipes[k];if(!r)return [];
 const factor=portions/recipePortions(k);
 return r[2].map((raw,i)=>{const p=ingredientParts(raw);return {key:'v3:'+w+':'+day+':'+k+':'+i,raw,name:p.name,qty:p.unmeasured?'Menge im Rezept prüfen':amount(p.qty*factor)+' '+p.unit,side,unmeasured:p.unmeasured}});
}
function shoppingForWeek(w){
 const items=[];const offset=w*7;
 for(let i=0;i<7;i++){
  const d=state.days[offset+i];if(!d?.key||!state.recipes[d.key])continue;
  const prev=state.days[offset+i-1];
  // Only consecutive repeats marked as leftovers are not another cooking event.
  if(prev?.key===d.key&&/reste|vortag/i.test(d.note||''))continue;
  const portions=dishPortions(d);
  const group={day:i,index:offset+i,heading:dayName(dateAt(offset+i))+', '+fmt(dateAt(offset+i)),name:state.recipes[d.key][0],portions,rows:makeRows(d.key,portions,w,i)};
  for(const side of d.sideKeys||[]){if(state.recipes[side])group.rows.push(...makeRows(side,portions,w,i,true))}
  items.push(group);
 }
 return items;
}

const deletedKey='kochbegleiter_deleted_recipes_v1';
let deletedRecipes=[];
try { deletedRecipes=JSON.parse(localStorage.getItem(deletedKey)||'[]'); if(!Array.isArray(deletedRecipes)) deletedRecipes=[]; } catch(e){deletedRecipes=[];}
for(const k of deletedRecipes) delete state.recipes[k];
for(const k of deletedRecipes) { if(state.days.some(d=>d.key===k)) continue; }
const additionalSides = ['gyeranguk','hobakjeon','gamjajorim','gyeranjjim'];
additionalSides.forEach(k=>sideKeys.add(k));
const additionalFish=['tuna','codbeans','misosalmon','mackerel','sundubu'];
additionalFish.forEach(k=>fishKeys.add(k));
let recipeSearch='',recipeFilter='Alle';
function recipeCategory(k,r){
  if(recipeMetadata[k]) return recipeMetadata[k].category;
  if(sideKeys.has(k)) return 'Beilagen';
  if(fishKeys.has(k)) return 'Fisch & Meeresfrüchte';
  if(/suppe|guk|jjigae|çorbası|dal/i.test(r[0]))return 'Suppen & Eintöpfe';
  return 'Hauptgerichte';
}
function recipeMatches(k,r){
  const search=recipeSearch.trim().toLocaleLowerCase('de');
  const text=[r[0],r[1],...(r[2]||[])].join(' ').toLocaleLowerCase('de');
  if(search&&!text.includes(search))return false;
  if(recipeFilter==='Alle')return true;
  if(recipeFilter==='Proteinreich')return (recipeMetadata[k]?.protein||0)>=35 || ['chickenorzo','jeyuk','mapo','dakbokkeumtang','salmonteriyaki','kra_pao','gyros'].includes(k);
  if(recipeFilter==='Fisch & Meeresfrüchte')return fishKeys.has(k);
  return recipeCategory(k,r)===recipeFilter;
}
function renderRecipes(){
 const categories=['Alle','Hauptgerichte','Suppen & Eintöpfe','Beilagen','Proteinreich','Fisch & Meeresfrüchte'];
 const found=Object.entries(state.recipes).filter(([k,r])=>recipeMatches(k,r));
 out.innerHTML='<h3>Deine Rezeptsammlung 🍲</h3><p class="muted">Rezepte suchen, filtern, hinzufügen oder bearbeiten.</p><button class="primary" id="add">＋ Neues Rezept</button><label class="fieldlabel" for="recipeSearch">🔎 Rezeptsuche</label><input class="field" id="recipeSearch" placeholder="Name, Hangul oder Zutat suchen …" value="'+esc(recipeSearch)+'"><label class="fieldlabel" for="recipeFilter">Kategorie</label><select class="field" id="recipeFilter">'+categories.map(c=>'<option '+(c===recipeFilter?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><p class="subtle">'+found.length+' von '+Object.keys(state.recipes).length+' Rezepten</p><div id="recipeResults">'+found.map(([k,r])=>'<div class="recipe"><span class="tag">'+esc(recipeCategory(k,r))+'</span><h3>'+esc(r[0])+'</h3><p>⏱ '+esc(r[1])+(recipeMetadata[k]?.protein?' · ca. '+recipeMetadata[k].protein+' g Protein/Portion':'')+'</p><div class="actionrow"><button class="primary" data-recipe="'+esc(k)+'">Rezept öffnen</button><button class="outline" data-editrecipe="'+esc(k)+'">Bearbeiten</button><button class="outline" data-delete="'+esc(k)+'" aria-label="Rezept löschen">🗑️</button></div></div>').join('')+(found.length?'':'<p class="note">Keine passenden Rezepte gefunden.</p>')+'</div>'+backupBox();
 out.querySelector('#add').onclick=()=>{editor='new';render()};
 const search=out.querySelector('#recipeSearch');search.oninput=()=>{recipeSearch=search.value;const pos=search.selectionStart;renderRecipes();const next=out.querySelector('#recipeSearch');next.focus();next.setSelectionRange(pos,pos)};
 out.querySelector('#recipeFilter').onchange=e=>{recipeFilter=e.target.value;renderRecipes()};
 out.querySelectorAll('[data-recipe]').forEach(x=>x.onclick=()=>{selected=x.dataset.recipe;render()});
 out.querySelectorAll('[data-editrecipe]').forEach(x=>x.onclick=()=>{editor=x.dataset.editrecipe;render()});
 out.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{
  const k=x.dataset.delete,r=state.recipes[k];if(!r)return;
  const scheduled=state.days.filter(d=>d.key===k).length;
  if(!confirm('Rezept „'+r[0]+'“ wirklich löschen?'+(scheduled?' Es ist an '+scheduled+' Tagen eingeplant; diese Tage werden zu freien Abenden.':'')))return;
  delete state.recipes[k];deletedRecipes=[...new Set([...deletedRecipes,k])];
  state.days.forEach(d=>{if(d.key===k){d.key='';d.title='Flexibler Abend';d.note='Rezept gelöscht';d.sideKeys=[];}else if(d.sideKeys){d.sideKeys=d.sideKeys.filter(x=>x!==k)}});
  try{localStorage.setItem(deletedKey,JSON.stringify(deletedRecipes))}catch(e){}
  save();renderRecipes();
 });
 bindBackup();
}
const originalRenderDetail=renderDetail;
renderDetail=function(){originalRenderDetail();const m=recipeMetadata[selected];if(!m)return;const detail=out.querySelector('.detail');if(detail){const el=document.createElement('div');el.className='note';el.textContent='💪 Ca. '+m.protein+' g Protein pro Portion (Schätzwert) · 🧊 '+m.storage;detail.appendChild(el)}};
// Restore any imported backup's missing catalogue entries without overwriting edits.
const oldBindBackup=bindBackup;
bindBackup=function(){oldBindBackup();const file=out.querySelector('#backupfile');if(!file)return;const old=file.onchange;file.onchange=async e=>{await old(e);for(const [k,r] of Object.entries(catalogueAdditions)){if(!state.recipes[k]&&!deletedRecipes.includes(k))state.recipes[k]=r}save();render()}};

document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;selected=null;editor=null;editDay=null;render()});save();render();
</script></body></html>
