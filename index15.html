// Dynamic ingredient quantities, per-recipe groups, and persistent checkmarks.
function ingredientParts(raw){
 let t=String(raw||'').trim().replace(/^ca\.\s*/i,'');
 const fractions={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};
 const m=t.match(/^(\d+(?:[.,]\d+)?|[½¼¾⅓⅔]|\d+\s*[½¼¾])\s*(?:(kg|g|ml|l|EL|TL|Stück|Dose|Dosen|Bund|Packung|Packungen|Zehen|Eier)\s+)?(.+)$/i);
 if(!m)return {name:t,qty:0,unit:'',unmeasured:true};
 let n=m[1].replace(',','.');for(const [f,v] of Object.entries(fractions))n=n.replace(f,'+'+v);
 let qty=n.split('+').reduce((a,b)=>a+Number(b),0),unit=(m[2]||'Stück').toLowerCase(),name=m[3].trim();
 if(unit==='kg'){qty*=1000;unit='g'}if(unit==='l'){qty*=1000;unit='ml'}
 if(unit==='dosen')unit='dose';if(unit==='packungen')unit='packung';if(unit==='zehen')unit='zehe';
 if(unit==='eier'){name='Eier '+name;unit='stück'}
 return {name,qty,unit,unmeasured:false};
}
function amount(n){return Number.isInteger(n)?String(n):String(Math.round(n*100)/100).replace('.',',')}
function makeRows(k,portions,w,day,side=false){const r=state.recipes[k];if(!r)return [];

}
function shoppingForWeek(w){
 const items=[];const offset=w*7;
 for(let i=0;i<7;i++){
  const d=state.days[offset+i];if(!d?.key||!state.recipes[d.key])continue;
  const prev=state.days[offset+i-1];
  // Only consecutive repeats marked as leftovers are not another cooking event.
  if(prev?.key===d.key && (/reste|vortag/i.test(d.note||'') || (dishPortions(prev)>=2 && !/frisch kochen|neu kochen/i.test(d.note||''))))continue;
  const portions=dishPortions(d);
  const group={day:i,index:offset+i,heading:dayName(dateAt(offset+i))+', '+fmt(dateAt(offset+i)),name:state.recipes[d.key][0],portions,rows:makeRows(d.key,portions,w,i)};
  for(const side of d.sideKeys||[]){if(state.recipes[side])group.rows.push(...makeRows(side,portions,w,i,true))}
  group.rows=group.rows.filter(r=>!isWaterIngredient(r.raw)&&!isWaterIngredient(r.name));
  items.push(group);
 }

}

function isWaterIngredient(s){return /^(?:(?:\d+(?:[,.]\d+)?\s*(?:ml|l|liter)\s+)?(?:wasser|leitungswasser)|(?:wasser|leitungswasser)\s*\([^)]*\))$/i.test(String(s||'').trim())}
// Einkaufsliste: gruppenübergreifend einmaliger Abzug genauer Bestände, andere Bestände nur als Prüfhinweis.
function pUnit(u){u=String(u||'').toLowerCase();return ({kg:'g',l:'ml',stück:'stück',dose:'dose',packung:'packung',bund:'bund'})[u]||u}
function pQty(x){return x.unit==='kg'?x.qty*1000:x.unit==='l'?x.qty*1000:x.qty}
function pMatch(name,stock){const a=pNorm(name),b=pNorm(stock);return a===b||a.includes(b)&&b.length>3||b.includes(a)&&a.length>3}
function stockNotes(rows){
 const used={},map={};
 for(const r of rows){
  const ing=ingredientParts(r.raw), matches=state.pantry.filter(x=>pMatch(ing.name,x.name));
  const exact=matches.filter(x=>x.mode==='Genau'&&pUnit(x.unit)===pUnit(ing.unit));
  const other=matches.filter(x=>x.mode!=='Genau');
  const needed=ing.unmeasured?0:Math.max(0,Number(r.qty.match(/^[\d.,]+/)?.[0].replace(',','.'))||ing.qty);
  let remaining=needed;
  for(const x of exact){const available=Math.max(0,pQty(x)-(used[x.id]||0));const take=Math.min(available,remaining);remaining-=take;used[x.id]=(used[x.id]||0)+take;}
  const stapleReady=other.some(x=>x.staple&&x.mode==='Ungefähr'&&['Voll','Halb voll'].includes(x.approx));
  const covered=(!ing.unmeasured&&needed>0&&remaining<0.00001)||stapleReady;
  map[r.key]={covered,remaining,needed,ing,note:covered?'✓ Im Vorrat':exact.length&&remaining<needed?'Im Vorrat: '+amount(needed-remaining)+' '+ing.unit+' · Noch '+amount(remaining)+' '+ing.unit+' kaufen':other.length?'⚠️ Vorrat prüfen':'',uncertain:other.length>0&&!exact.length&&!stapleReady};
 }
 return map;
}

 (candidates.length?candidates.map((x,i)=>'<div class="note" style="margin:8px 0"><label><input type="checkbox" data-use="'+i+'" checked> '+esc(x.stock.name)+' <small>('+esc(x.stock.place)+', vorhanden: '+amount(pQty(x.stock))+' '+esc(pUnit(x.stock.unit))+')</small></label><div class="editrow"><input class="field" type="number" min="0" step="any" data-usedqty="'+i+'" value="'+Math.min(x.need,pQty(x.stock))+'"><span>'+esc(pUnit(x.stock.unit))+'</span></div></div>').join(''):'<div class="note">Keine eindeutig zuordenbaren Mengen gefunden. Du kannst deinen Vorrat später manuell anpassen.</div>')+
 '<h4>🍱 Übrig gebliebene Portionen</h4><p class="subtle">Beispiel: 2 Portionen gekocht, 1 gegessen → hier 1 eintragen. Nur die übrigen fertigen Portionen werden gespeichert, keine zusätzlichen Zutaten abgezogen.</p><div class="editrow"><input class="field" type="number" id="finishLeft" min="0" step="1" value="0" aria-label="Restportionen"><select class="field" id="finishPlace"><option>Kühlschrank</option><option>Gefrierfach</option></select></div><label class="fieldlabel">Haltbar bis (optional)</label><input class="field" type="date" id="finishExpiry"><div class="actionrow"><button class="primary" id="finishSave">Bestätigen & speichern</button><button class="outline" id="finishCancel">Ohne Vorratsänderung schließen</button></div>';
 cover.appendChild(panel);document.body.appendChild(cover);
 panel.querySelector('#finishCancel').onclick=()=>cover.remove();
 panel.querySelector('#finishSave').onclick=()=>{
 const updates=[];
 for(let i=0;i<candidates.length;i++){
  if(!panel.querySelector('[data-use="'+i+'"]').checked)continue;
  const amountUsed=Number(panel.querySelector('[data-usedqty="'+i+'"]').value),x=candidates[i];
  if(!Number.isFinite(amountUsed)||amountUsed<0||amountUsed>pQty(x.stock)){alert('Bitte gültige Mengen eingeben (nicht mehr als im Vorrat vorhanden).');return}
  updates.push({item:x.stock,amount:amountUsed});
 }
 const portions=Number(panel.querySelector('#finishLeft').value);
 if(!Number.isInteger(portions)||portions<0){alert('Bitte eine gültige Anzahl Restportionen eingeben.');return}
 // Apply atomically only after all entries have been validated.
 for(const u of updates){const base=pQty(u.item)-u.amount;u.item.qty=u.item.unit==='kg'||u.item.unit==='l'?base/1000:base;}
 if(portions>0)state.leftovers.push({id:pId(),name:titleOf(d.key),portions,place:panel.querySelector('#finishPlace').value,expiry:panel.querySelector('#finishExpiry').value||(panel.querySelector('#finishPlace').value==='Kühlschrank'?datePlus(2):'')});
 if(!Array.isArray(state.finishedCooking))state.finishedCooking=[];
 state.finishedCooking.push(day);state.cooked=[...new Set([...state.cooked,day])];save();cover.remove();render();
 };
}

// Reliable cooking-day classification: a leftover day must follow an actual cooking
// of the same dish. Manual choices take priority over automatic notes.
function isActualLeftover(index){
 const d=state.days[index];if(!d?.key)return false;
 if(d.cookingMode==='cook')return false;
 const prev=state.days[index-1];
 if(!prev||prev.key!==d.key)return false;
 if(d.cookingMode==='leftover')return true;
 return /reste|vortag|aufwärm/i.test(d.note||'') && !/frisch kochen|neu kochen/i.test(d.note||'');
}
// Fix legacy autogenerated 'leftover' entries that don't have a preceding cook.
function repairPlanModes(){
 let changed=false;
 state.days.forEach((d,i)=>{
  if(!d?.key)return;
  const prev=state.days[i-1];
  if(d.cookingMode==='leftover'&&prev?.key!==d.key){d.cookingMode='cook';changed=true;}
  if(d.cookingMode!=='cook'&&/reste|vortag|aufwärm/i.test(d.note||'')&&prev?.key!==d.key){d.cookingMode='cook';d.note='Frisch kochen';changed=true;}
 });
 if(changed)save();
}
repairPlanModes();
// Replace the original shopping grouping with the same classification used by the plan.
shoppingForWeek=function(w){
 const items=[],offset=w*7;
 for(let i=0;i<7;i++){
  const d=state.days[offset+i];if(!d?.key||!state.recipes[d.key]||isActualLeftover(offset+i))continue;
  const portions=dishPortions(d);
  const group={day:i,index:offset+i,heading:dayName(dateAt(offset+i))+', '+fmt(dateAt(offset+i)),name:state.recipes[d.key][0],portions,rows:makeRows(d.key,portions,w,i)};
  for(const side of d.sideKeys||[]){if(state.recipes[side])group.rows.push(...makeRows(side,portions,w,i,true))}
  group.rows=group.rows.filter(r=>!isWaterIngredient(r.raw)&&!isWaterIngredient(r.name));items.push(group);
 }
 return items;
};
// In the day editor, allow an explicit override rather than relying on text in notes.
const originalDayEditor=renderDayEditor;
renderDayEditor=function(){
 originalDayEditor();const apply=out.querySelector('#apply');if(!apply)return;
 const d=state.days[editDay],idx=editDay;
 const label=document.createElement('label');label.className='fieldlabel';label.textContent='Art des Termins';
 const select=document.createElement('select');select.className='field';select.id='cookingMode';
 select.innerHTML='<option value="cook">🍳 Frisch kochen</option><option value="leftover">♻ Reste essen</option>';
 select.value=isActualLeftover(idx)?'leftover':'cook';
 const portionsLabel=[...out.querySelectorAll('label')].find(x=>x.textContent.includes('Portionen beim Kochen'));
 if(portionsLabel){portionsLabel.before(label,select)}else apply.before(label,select);
 const original=apply.onclick;
 apply.onclick=()=>{
  const mode=select.value,key=out.querySelector('#dish').value;
  if(mode==='leftover'&&key&&state.days[idx-1]?.key!==key){alert('Reste essen ist nur möglich, wenn das Gericht am Vortag gekocht wurde. Wähle sonst „Frisch kochen“.');return}
  original();const updated=state.days[idx];if(updated?.key){updated.cookingMode=mode;updated.note=mode==='leftover'?'Reste vom Vortag':'Frisch kochen';save();render()}
 };
};
// Visual plan and checkbox behavior use the same single source of truth.
const previousFixedPlan=renderPlan;
renderPlan=function(){
 previousFixedPlan();
 out.querySelectorAll('.day').forEach(card=>{
  const edit=card.querySelector('[data-editday]');if(!edit)return;
  const n=Number(edit.dataset.editday),d=state.days[n];if(!d?.key)return;
  const leftover=isActualLeftover(n),hint=card.querySelector('.meal small'),finish=card.querySelector('.cook-finish-btn');
  if(hint){let text=hint.textContent.replace(/^(♻ Reste essen · )+/,'');
   if(leftover){hint.textContent='♻ Reste essen · keine Zutaten einkaufen';}
   else {text=text.replace(/Reste vom Vortag|Reste essen/gi,'Frisch kochen');hint.textContent=text;}
  }
  if(leftover){finish?.remove();const cb=card.querySelector('[data-cook]');if(cb){cb.disabled=true;cb.title='Restetag – kein neuer Kochabschluss'}}
  else if(!finish&&!state.cooked.includes(n)){
   const btn=document.createElement('button');btn.className='cook-finish-btn';btn.type='button';btn.textContent='✓ Fertig gekocht';btn.onclick=()=>cookingFinish(n);card.querySelector('.meal')?.appendChild(btn);
  }
 });
};
