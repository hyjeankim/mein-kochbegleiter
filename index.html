<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Kochbegleiter</title><style>
:root{font-family:system-ui,sans-serif;color:#243b32;background:#f4f6f1}*{box-sizing:border-box}body{margin:0}.app{max-width:650px;margin:auto;background:#fff;min-height:100vh}.hero{background:linear-gradient(120deg,#254d40,#55846b);color:white;padding:24px 20px}.hero small{letter-spacing:2px;font-size:10px}.hero h1{font-size:29px;line-height:1.1;margin:9px 0}.hero p{font-size:12px;opacity:.85}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:7px;background:#edf2ec}.tabs button{background:transparent;border:0;padding:12px 4px;font-weight:700;font-size:12px;color:#61756a;border-radius:10px}.tabs button.active{background:white;color:#254d40}button{font:inherit;cursor:pointer}.body{padding:16px 13px 35px}.week{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;text-align:center}.week button,.outline{background:white;border:1px solid #dce5dc;border-radius:10px;padding:9px 12px}.day{display:flex;align-items:center;gap:10px;border:1px solid #dce5dc;border-radius:14px;padding:12px 9px;margin:9px 0}.date{background:#edf2ec;padding:9px 4px;min-width:44px;text-align:center;border-radius:10px}.date b{font-size:19px;display:block}.date small,.meal small,.muted{color:#738479;font-size:11px}.meal{flex:1;min-width:0}.meal b{font-size:13px;line-height:1.4;display:block}.day.done{background:#f4f6f1}.day.done .meal b{text-decoration:line-through;opacity:.6}input[type=checkbox]{width:22px;height:22px;accent-color:#43866d;flex-shrink:0}.mini{border:1px solid #dce5dc;background:white;border-radius:9px;padding:8px;font-size:11px}.note{background:#edf2ec;border-radius:12px;padding:12px;margin:14px 0;font-size:12px;line-height:1.5}.shopgroup,.recipe{border:1px solid #dce5dc;border-radius:14px;overflow:hidden;margin:13px 0}.shophead{background:#edf2ec;padding:12px;font-size:12px;font-weight:700}.shoprow{display:flex;align-items:center;gap:11px;padding:12px;border-top:1px solid #e9eee8}.shoprow span{flex:1;font-size:13px}.shoprow small{font-size:11px;color:#738479}.shoprow.done span{text-decoration:line-through;opacity:.55}.bar{height:7px;border-radius:10px;background:#edf2ec;overflow:hidden}.bar div{height:100%;background:#43866d}.recipe{padding:14px}.recipe h3{font-size:16px;margin:0 0 5px}.recipe p{font-size:12px;color:#738479}.primary{border:0;background:#326a59;color:white;padding:10px 13px;border-radius:10px;font-size:12px;font-weight:700}.detail{border:1px solid #dce5dc;border-radius:14px;padding:16px;margin-top:12px}.detail h2{font-size:21px}.detail h4{margin:20px 0 8px}.detail li{font-size:13px;line-height:1.6;margin:7px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tools button{font-size:12px}.warning{font-size:11px;color:#66766b;line-height:1.5}

</style></head><body><div class="app"><div class="hero"><small>JEANS KÜCHE · DEIN KOCHBEGLEITER</small><h1>Gut essen.<br>Entspannt kochen. 🌿</h1><p>Dein fortlaufender Wochenplan</p></div><div class="tabs"><button data-tab="plan" class="active">📅 Wochenplan</button><button data-tab="shop">🛒 Einkaufen</button><button data-tab="recipes">🍲 Rezepte</button></div><main class="body" id="content"></main></div><script>
const defaultDays=[['23','Mo','Sogogi-Muguk','Reste · Sport','soup'],['24','Di','Sogogi-Muguk','Reste · Sport / Büro','soup'],['25','Mi','Zitronen-Orzo mit Spinat & Parmesan','25 Min. · 2 Portionen','orzo'],['26','Do','Zitronen-Orzo','Reste · Sport','orzo'],['27','Fr','Flexibler Abend','Auswärts oder Vorrat',''],['28','Sa','Doenjang-Jjigae','30 Min. · Koreanisch','jjigae'],['29','So','Jjigae-Reste & Vorbereitung','Meal Prep','jjigae'],['30','Mo','Gochujang-Hähnchen mit Reis','Reste · Sport','chicken'],['01','Di','Gochujang-Hähnchen','Reste · Sport / Büro','chicken'],['02','Mi','Mediterraner Kabeljau mit Oliven, Kapern & Tomaten','25 Min. · 2 Portionen','cod'],['03','Do','Mediterraner Kabeljau','Reste · Sport','cod'],['04','Fr','Flexibler Abend','Auswärts oder Vorrat',''],['05','Sa','Kimchi-Bratreis mit Ei','20 Min. · Koreanisch','kimchi'],['06','So','Bibimbap mit Gemüse','Vorbereitung für Montag','bibimbap'],['07','Mo','Bibimbap','Reste · Sport','bibimbap'],['08','Di','TK-Portion oder Reis mit Ei','Schnell · Sport / Büro',''],['09','Mi','Shakshuka mit Feta','25 Min. · 2 Portionen','shakshuka'],['10','Do','Shakshuka','Reste · Sport','shakshuka'],['11','Fr','Flexibler Abend','Auswärts oder Vorrat',''],['12','Sa','Seelachs mit Soja-Honig','Fischabend','fish'],['13','So','Dubu-Jorim mit Reis','Koreanisch · 2 Portionen','tofu'],['14','Mo','Dubu-Jorim','Reste · Sport','tofu'],['15','Di','TK-Portion / Gemüse-Reis','Schnell · Sport / Büro',''],['16','Mi','Lachs-Spinat-Pasta','30 Min. · 2 Portionen','pasta'],['17','Do','Lachs-Spinat-Pasta','Reste · Sport','pasta'],['18','Fr','Flexibler Abend','Auswärts oder Vorrat',''],['19','Sa','Gochujang-Aubergine mit Reis','30 Min. · Koreanisch','eggplant'],['20','So','Resteabend oder Lieblingsgericht','Vorrat aufbrauchen','']];
const groups=[['So, 22. Nov.','Rindfleisch|350 g','Daikon|450 g','Frühlingszwiebeln|1 Bund'],['Mi, 25. Nov.','Orzo|160 g','Spinat|125–150 g','Zitrone|1 Stück','Parmesan|bereits vorhanden'],['Sa, 28. Nov.','Tofu|200 g','Zucchini|1 Stück','Champignons|150 g'],['So, 29. Nov.','Hähnchen|300 g'],['Mi, 2. Dez.','Kabeljaufilet|300–400 g','Cherrytomaten|ca. 80 g','Kalamata-Oliven|ca. 40 g','Rote Zwiebel|¼ Stück','Kapern|3 TL','Zitrone|½ Stück','Knoblauch|2 Zehen','Petersilie oder Basilikum|2 EL'],['Sa, 5. Dez.','Kimchi|1 Glas'],['So, 6. Dez.','Karotte|1 Stück'],['Mi, 9. Dez.','Tomatenstücke|1 Dose','Feta|1 Packung','Eier|6 Stück'],['Sa, 12. Dez.','TK-Seelachs|1–2 Filets','Gurke|1 Stück'],['So, 13. Dez.','Fester Tofu|250 g'],['Mi, 16. Dez.','TK-Lachs|250 g','Babyspinat|125 g','Frischkäse|kleine Packung'],['Sa, 19. Dez.','Aubergine|1 Stück']];
const recipes={cod:['Mediterraner Kabeljau mit Oliven, Kapern und Tomaten','25 Min. · 2 Portionen',['300–400 g Kabeljau (2 Filets)','1 EL Olivenöl','Saft von ½ Zitrone','2 Knoblauchzehen','½ TL Paprikapulver','½ TL getrockneter Oregano','¼ TL Salz und etwas Pfeffer','80 g Cherrytomaten','40 g Kalamata-Oliven','¼ kleine rote Zwiebel','3 TL Kapern','2 EL Petersilie oder Basilikum','Reis, Couscous oder Brot'],['Backofen auf 200 °C Ober-/Unterhitze vorheizen. Kabeljau trocken tupfen.','Fisch in eine Auflaufform legen und mit Olivenöl und Zitronensaft beträufeln.','Knoblauch, Paprika, Oregano, Salz und Pfeffer darauf verteilen.','Tomaten, Oliven, Zwiebel und Kapern rundherum verteilen.','Ca. 12–15 Minuten backen, bei dickeren Filets länger, bis der Fisch vollständig durchgegart ist.','Mit Kräutern und Reis, Couscous oder Brot servieren. Zweite Portion rasch kühlen und am nächsten Tag vollständig durcherhitzen.'],'Kapern und Oliven sind salzig: sparsam salzen.'],orzo:['Cremiger Zitronen-Orzo','25 Min. · 2 Portionen',['160 g Orzo','120–150 g Spinat','40 g Parmesan (bereits geöffnet)','1 Zitrone','1 Knoblauchzehe','400–450 ml Gemüsebrühe'],['Knoblauch in 1 EL Olivenöl anschwitzen.','Orzo und 400 ml Brühe zugeben, 10–12 Minuten köcheln und regelmäßig rühren.','Spinat unterheben, Herd ausschalten und Parmesan einrühren.','Mit 1 EL Zitronensaft und ¼ TL Pfeffer abschmecken.'],'Zweite Portion für Donnerstag kühlen.'],soup:['Sogogi-Muguk','60 Min. · 3 Portionen',['350 g Rindfleisch','450 g Daikon','2 Frühlingszwiebeln','2 Knoblauchzehen','900 ml Wasser'],['Fleisch in 1 EL Sesamöl 3 Minuten anbraten.','Rettich 3 Minuten mitbraten.','Knoblauch, 1 EL Sojasauce und Wasser zugeben und 45–50 Minuten köcheln.','Frühlingszwiebeln zugeben und abschmecken.'],'Für Montag und Dienstag aufwärmen.'],jjigae:['Doenjang-Jjigae','30 Min. · 2 Portionen',['200 g Tofu','½ Zucchini','150 g Champignons','Frühlingszwiebeln','500 ml Wasser','1–1½ EL Doenjang'],['Gemüse und Tofu würfeln.','Wasser mit 1 EL Doenjang aufkochen.','Gemüse 10 Minuten und Tofu weitere 5–7 Minuten köcheln.','Frühlingszwiebeln zugeben und abschmecken.'],'Doenjang ist bereits salzig.'],chicken:['Gochujang-Hähnchen','25 Min. · 2 Portionen',['300 g Hähnchen','1 Paprika','½ Zwiebel','Reis'],['Reis kochen.','1 EL Gochujang, 1 EL Sojasauce, 1 TL Honig, 1 TL Sesamöl und 2 EL Wasser verrühren.','Hähnchen und Gemüse vollständig durchbraten.','Sauce zugeben und einkochen.'],'Für weniger Schärfe ½ EL Gochujang verwenden.'],kimchi:['Kimchi-Bratreis','20 Min. · 2 Portionen',['250 g gekochter, gekühlter Reis','150 g Kimchi','2 Eier','Frühlingszwiebeln'],['Kimchi klein schneiden und anbraten.','Reis zugeben und 5 Minuten braten.','1 TL Sojasauce und 1 TL Sesamöl unterrühren.','Spiegeleier darauf servieren.'],'Reis rasch kühlen.'],bibimbap:['Bibimbap','30 Min.',['Reis','Karotte','Zucchini','Ei','Sojasauce und Sesamöl'],['Reis kochen.','Gemüse in Streifen schneiden und anbraten.','Ei braten.','Mit Reis anrichten und würzen.'],'Gemüse lässt sich vorbereiten.'],shakshuka:['Shakshuka mit Feta','25 Min. · 2 Portionen',['1 Dose gehackte Tomaten','1 Paprika','½ Zwiebel','2 Eier','70 g Feta'],['Zwiebel und Paprika 5 Minuten anbraten.','Tomaten, ½ TL Kreuzkümmel, ½ TL Paprika und ¼ TL Salz zugeben und 10 Minuten köcheln.','Eier hineingeben und abgedeckt stocken lassen.','Feta darüberbröseln.'],'Sauce für die zweite Portion separat aufbewahren.'],fish:['Seelachs mit Soja-Honig','25 Min.',['Seelachsfilet','Gurke','Reis','Sojasauce','Honig'],['Reis kochen und Gurke schneiden.','Fisch auftauen, trocken tupfen und vollständig durchgaren.','Mit Sojasauce und etwas Honig glasieren.'],'Mit Gurke servieren.'],tofu:['Dubu-Jorim','25 Min. · 2 Portionen',['250 g fester Tofu','Frühlingszwiebeln','Reis'],['Tofu trocken tupfen und in Scheiben schneiden.','1 EL Sojasauce, 1 TL Zucker, 1 TL Sesamöl, 2 EL Wasser und optional 1 TL Gochugaru verrühren.','Tofu beidseitig anbraten.','Sauce zugeben und 5 Minuten einkochen lassen.'],'Tofu gut abtrocknen.'],pasta:['Lachs-Spinat-Pasta','30 Min.',['Lachs','Pasta','Spinat','Frischkäse'],['Pasta kochen.','Lachs vollständig garen.','Spinat und etwas Nudelwasser zugeben.','Frischkäse einrühren und Pasta unterheben.'],'Eine Portion für Donnerstag aufbewahren.'],eggplant:['Gochujang-Aubergine','30 Min.',['1 Aubergine','Reis','Frühlingszwiebeln'],['Reis kochen und Aubergine würfeln.','Aubergine in etwas Öl weich braten.','1 TL Gochujang, 1 TL Sojasauce, 1 TL Honig, 1 TL Sesamöl und 2 EL Wasser verrühren.','Sauce zugeben und mit Reis servieren.'],'Aubergine weich braten.']};


const start=new Date(2026,10,23);const KEY='kochbegleiter_2026_v2';const LEGACY='kochbegleiter_2026_v1';
let tab='plan',week=0,selected=null,editor=null,editDay=null,storageOK=true;
let state={version:2,days:defaultDays.map(d=>({key:d[4],title:d[2],note:d[3]})),recipes:JSON.parse(JSON.stringify(recipes)),cooked:[],bought:['1-3'],generatedWeeks:4};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.version===2){state={...state,...saved}}else{const legacy=JSON.parse(localStorage.getItem(LEGACY)||'null');if(legacy){state.cooked=legacy.cooked||[];state.bought=legacy.bought||[]}}}catch(e){storageOK=false}
const out=document.getElementById('content');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateAt(n){const d=new Date(start);d.setDate(d.getDate()+n);return d}
function dayName(d){return ['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()]}
function fmt(d){return d.toLocaleDateString('de-DE',{day:'numeric',month:'short'})}
function titleOf(k){return state.recipes[k]?.[0]||'Freier Abend'}
function weekLabel(w){return fmt(dateAt(w*7))+' – '+fmt(dateAt(w*7+6))}
function ensureWeek(w){if(w<state.generatedWeeks)return;while(state.generatedWeeks<=w){generateWeek(state.generatedWeeks);state.generatedWeeks++}save()}
function generateWeek(w){const keys=Object.keys(state.recipes);const previous=state.days.slice(Math.max(0,w*7-21),w*7).map(x=>x.key);const ranked=keys.map(k=>({k,score:previous.filter(v=>v===k).length*10+Math.random()*2})).sort((a,b)=>a.score-b.score);let pool=ranked.map(x=>x.k);const fish=pool.find(k=>/fisch|lachs|kabeljau|seelachs/i.test(state.recipes[k][0]))||pool[0];pool=pool.filter(k=>k!==fish);const pick=()=>pool.shift()||fish;const a=pick(),b=pick(),c=pick(),d=pick();const weekDays=[{key:a,title:titleOf(a),note:'Vorbereitung · 2 Portionen'},{key:a,title:titleOf(a),note:'Reste · Sport'},{key:b,title:titleOf(b),note:'Frisch gekocht'},{key:b,title:titleOf(b),note:'Reste · Sport'},{key:'',title:'Flexibler Abend',note:'Auswärts oder Vorrat'},{key:fish,title:titleOf(fish),note:'Fischgericht'},{key:c,title:titleOf(c),note:'2 Portionen · für Montag'}];state.days.push(...weekDays)}
function backupBox(){return '<div class="note"><b>💾 Deine Daten sichern</b><p class="subtle">'+(storageOK?'Automatisches Speichern auf diesem Gerät aktiv.':'Lokale Speicherung nicht verfügbar. Bitte Backup verwenden.')+'</p><div class="actionrow"><button class="outline" id="export">Backup herunterladen</button><button class="outline" id="import">Backup importieren</button></div><input type="file" id="backupfile" accept=".json,application/json" hidden><p class="subtle">Backups enthalten jetzt auch Rezepte und Wochenpläne. Daten bleiben nur in diesem Browser; GitHub speichert deine persönlichen Änderungen nicht.</p></div>'}
function bindBackup(){const ex=out.querySelector('#export');if(!ex)return;ex.onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='kochbegleiter-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};out.querySelector('#import').onclick=()=>out.querySelector('#backupfile').click();out.querySelector('#backupfile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const v=JSON.parse(await f.text());if(v.version!==2||!Array.isArray(v.days)||!v.recipes||!Array.isArray(v.cooked)||!Array.isArray(v.bought))throw Error();if(!confirm('Alle aktuellen Daten durch dieses Backup ersetzen?'))return;state=v;save();render()}catch(e){alert('Backup konnte nicht gelesen werden.')}}}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(editor!==null){renderEditor();return}if(editDay!==null){renderDayEditor();return}if(selected){renderDetail();return}if(tab==='plan')renderPlan();else if(tab==='shop')renderShop();else renderRecipes()}
function renderPlan(){ensureWeek(week);out.innerHTML='<div class="week"><button class="outline" id="prev" '+(week===0?'disabled':'')+'>‹</button><div><b>Woche '+(week+1)+'</b><div class="muted">'+weekLabel(week)+'</div></div><button class="outline" id="next">›</button></div>'+(week>=4?'<div class="note">✨ Diese Woche wurde automatisch vorgeschlagen. Du kannst jedes Gericht ändern.</div>':'')+state.days.slice(week*7,week*7+7).map((d,i)=>{const n=week*7+i,dt=dateAt(n),done=state.cooked.includes(n);return '<div class="day '+(done?'done':'')+'"><div class="date"><b>'+dt.getDate()+'</b><small>'+dayName(dt)+'</small></div><input type="checkbox" data-cook="'+n+'" '+(done?'checked':'')+' aria-label="Gekocht"><div class="meal"><b>'+esc(d.title)+'</b><small>'+(done?'✓ Gekocht · ':'')+esc(d.note)+'</small></div><button class="mini" data-editday="'+n+'">Ändern</button></div>'}).join('')+'<div class="actionrow"><button class="outline" id="newweek">✨ Neue Woche ansehen</button><button class="outline" id="regenerate">↻ Woche neu vorschlagen</button></div>'+backupBox();out.querySelector('#prev').onclick=()=>{week--;render()};out.querySelector('#next').onclick=()=>{week++;render()};out.querySelector('#newweek').onclick=()=>{week=state.generatedWeeks;ensureWeek(week);render()};out.querySelector('#regenerate').onclick=()=>{if(!confirm('Gerichte dieser Woche neu vorschlagen? Bereits gesetzte Häkchen dieser Woche werden entfernt.'))return;const n=week*7;state.days.splice(n,7);state.generatedWeeks=week;state.days=state.days.slice(0,n);state.cooked=state.cooked.filter(x=>x<n);generateWeek(week);state.generatedWeeks=week+1;save();render()};out.querySelectorAll('[data-cook]').forEach(x=>x.onchange=()=>{const n=+x.dataset.cook;state.cooked=x.checked?[...new Set([...state.cooked,n])]:state.cooked.filter(i=>i!==n);save();render()});out.querySelectorAll('[data-editday]').forEach(x=>x.onclick=()=>{editDay=+x.dataset.editday;render()});bindBackup()}
function renderDayEditor(){const d=state.days[editDay],dt=dateAt(editDay);out.innerHTML='<button class="outline" id="back">← Zurück</button><h3>'+dayName(dt)+', '+fmt(dt)+' bearbeiten</h3><label class="fieldlabel">Gericht auswählen</label><select class="field" id="dish"><option value="">Freier Abend / Reste</option>'+Object.entries(state.recipes).map(([k,r])=>'<option value="'+esc(k)+'" '+(k===d.key?'selected':'')+'>'+esc(r[0])+'</option>').join('')+'</select><label class="fieldlabel">Beschreibung / Hinweis</label><input class="field" id="note" value="'+esc(d.note)+'"><div class="actionrow"><button class="primary" id="apply">Speichern</button><button class="outline" id="clear">Freier Abend</button></div><div class="note">Du kannst ein Rezept auch zuerst in der Rezeptsammlung hinzufügen.</div>';out.querySelector('#back').onclick=()=>{editDay=null;render()};out.querySelector('#apply').onclick=()=>{const k=out.querySelector('#dish').value;state.days[editDay]={key:k,title:k?titleOf(k):'Flexibler Abend',note:out.querySelector('#note').value};editDay=null;save();render()};out.querySelector('#clear').onclick=()=>{state.days[editDay]={key:'',title:'Flexibler Abend',note:'Auswärts oder Vorrat'};editDay=null;save();render()}}
function renderRecipes(){out.innerHTML='<h3>Deine Rezeptsammlung 🍲</h3><p class="muted">Neue Rezepte hinzufügen oder bestehende bearbeiten.</p><button class="primary" id="add">＋ Neues Rezept</button>'+Object.entries(state.recipes).map(([k,r])=>'<div class="recipe"><h3>'+esc(r[0])+'</h3><p>⏱ '+esc(r[1])+'</p><div class="actionrow"><button class="primary" data-recipe="'+esc(k)+'">Rezept öffnen</button><button class="outline" data-editrecipe="'+esc(k)+'">Bearbeiten</button></div></div>').join('')+backupBox();out.querySelector('#add').onclick=()=>{editor='new';render()};out.querySelectorAll('[data-recipe]').forEach(x=>x.onclick=()=>{selected=x.dataset.recipe;render()});out.querySelectorAll('[data-editrecipe]').forEach(x=>x.onclick=()=>{editor=x.dataset.editrecipe;render()});bindBackup()}
function renderDetail(){const r=state.recipes[selected];if(!r){selected=null;render();return}out.innerHTML='<button class="outline" id="back">← Zurück</button><div class="detail"><div class="muted">REZEPTKARTE</div><h2>'+esc(r[0])+'</h2><div class="muted">⏱ '+esc(r[1])+'</div><h4>🧺 Zutaten</h4><ul>'+r[2].map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><h4>👩🏻‍🍳 Zubereitung</h4><ol>'+r[3].map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><div class="note">💡 '+esc(r[4])+'</div><button class="outline" id="edit">Rezept bearbeiten</button></div>';out.querySelector('#back').onclick=()=>{selected=null;render()};out.querySelector('#edit').onclick=()=>{editor=selected;selected=null;render()}}
function renderEditor(){const fresh=editor==='new',r=fresh?['','30 Min. · 2 Portionen',[],[],'']:state.recipes[editor];out.innerHTML='<button class="outline" id="back">← Zurück</button><h3>'+(fresh?'Neues Rezept':'Rezept bearbeiten')+'</h3><label class="fieldlabel">Gericht</label><input class="field" id="name" value="'+esc(r[0])+'" placeholder="z. B. Gemüse-Curry"><label class="fieldlabel">Zeit und Portionen</label><input class="field" id="time" value="'+esc(r[1])+'" placeholder="30 Min. · 2 Portionen"><label class="fieldlabel">Zutaten – eine pro Zeile, mit Menge</label><textarea class="field" id="ingredients" rows="7" placeholder="200 g Tofu&#10;1 EL Sojasauce">'+esc(r[2].join('\n'))+'</textarea><label class="fieldlabel">Zubereitung – ein Schritt pro Zeile</label><textarea class="field" id="steps" rows="7">'+esc(r[3].join('\n'))+'</textarea><label class="fieldlabel">Tipp (optional)</label><textarea class="field" id="tip" rows="2">'+esc(r[4])+'</textarea><button class="primary" id="saveRecipe">Rezept speichern</button>';out.querySelector('#back').onclick=()=>{editor=null;render()};out.querySelector('#saveRecipe').onclick=()=>{const name=out.querySelector('#name').value.trim();if(!name){alert('Bitte einen Namen eingeben.');return}const arr=[name,out.querySelector('#time').value.trim(),out.querySelector('#ingredients').value.split('\n').map(x=>x.trim()).filter(Boolean),out.querySelector('#steps').value.split('\n').map(x=>x.trim()).filter(Boolean),out.querySelector('#tip').value.trim()];const key=fresh?'custom_'+Date.now():editor;state.recipes[key]=arr;state.days.forEach(d=>{if(d.key===key)d.title=name});editor=null;save();tab='recipes';render()}}
function renderShop(){const isOriginal=week<4;let items;if(isOriginal){items=groups.map((g,gi)=>({heading:g[0],rows:g.slice(1).map((v,ii)=>({key:gi+'-'+ii,text:v.split('|')[0],qty:v.split('|')[1]}))}))}else{const unique=[];const seen=new Set();state.days.slice(week*7,week*7+7).forEach(d=>{if(!d.key||seen.has(d.key))return;seen.add(d.key);const r=state.recipes[d.key];if(r)r[2].forEach((ing,i)=>unique.push({key:'w'+week+'-'+d.key+'-'+i,text:ing,qty:''}))});items=[{heading:'Woche '+(week+1)+' · '+weekLabel(week),rows:unique}]}
const all=items.flatMap(x=>x.rows),done=all.filter(x=>state.bought.includes(x.key)).length;out.innerHTML='<h3>Deine Einkaufsliste 🛒</h3><p class="muted">'+(isOriginal?'Einkäufe für die ersten vier Wochen, wie bisher.':'Zutaten aus den Rezepten dieser Woche. Doppelte Zutaten zwischen Rezepten sind noch nicht zusammengefasst.')+'</p><div class="editrow"><button class="outline" id="prev" '+(week===0?'disabled':'')+'>← Woche</button><b style="text-align:center">'+(week+1)+' · '+weekLabel(week)+'</b><button class="outline" id="next">Woche →</button></div><p class="subtle">'+done+' von '+all.length+' abgehakt</p><div class="bar"><div style="width:'+(all.length?done/all.length*100:0)+'%"></div></div>'+items.map(g=>'<div class="shopgroup"><div class="shophead">📍 '+esc(g.heading)+'</div>'+g.rows.map(r=>{const yes=state.bought.includes(r.key);return '<label class="shoprow '+(yes?'done':'')+'"><input type="checkbox" data-buy="'+esc(r.key)+'" '+(yes?'checked':'')+'><span>'+esc(r.text)+'</span><small>'+esc(r.qty)+'</small></label>'}).join('')+'</div>').join('')+backupBox();out.querySelector('#prev').onclick=()=>{week--;render()};out.querySelector('#next').onclick=()=>{week++;ensureWeek(week);render()};out.querySelectorAll('[data-buy]').forEach(x=>x.onchange=()=>{const k=x.dataset.buy;state.bought=x.checked?[...new Set([...state.bought,k])]:state.bought.filter(v=>v!==k);save();render()});bindBackup()}
document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;selected=null;editor=null;editDay=null;render()});save();render();
</script></body></html>
